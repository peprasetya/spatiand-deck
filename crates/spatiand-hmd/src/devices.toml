# The Ultra is deliberately listed with its real interface numbers even though it is not
# expected to work yet: its 512-byte IMU reports mean the packet parser needs a second
# layout, not just a table row. Better to fail with "unverified layout" than to silently
# mis-parse.
[[device]]
name = "XREAL Air 2 Ultra"
driver = "xreal"
vid = 0x3318
pid = 0x0426
verified = false
imu_interface = 2
mcu_interface = 0
imu_report_len = 512
per_eye = [1920, 1080]
h_fov_deg = 46.0
default_ipd_mm = 63.0
mode_mono = 0x05
mode_stereo = 0x04
mode_stereo_fallback = 0x03
