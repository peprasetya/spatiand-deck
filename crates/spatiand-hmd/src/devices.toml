# Supported headsets.
#
# Adding a device that speaks a protocol we already implement should be a row here, not a
# patch to the driver. `driver` selects which module handles it.
#
# Sources: `docs/xreal-air.md` §2 (USB identity) and §6 (display modes). Rows marked
# unverified come from the driver source rather than from hardware — the interface layout is
# believed to match across the Air family, but only the Air gen 1 has actually been plugged
# in and exercised.

[[device]]
name = "XREAL Air"
driver = "xreal"
vid = 0x3318
pid = 0x0424
verified = true            # confirmed on hardware: SBS at 72 Hz, IMU sane, 2026-08-11
imu_interface = 3
mcu_interface = 4
imu_report_len = 64
per_eye = [1920, 1080]
h_fov_deg = 40.0           # horizontal; the 46 deg on the box is diagonal
default_ipd_mm = 63.0
# MCU W_DISP_MODE (msgid 0x0008) payload values.
mode_mono = 0x05           # 1920x1080 @72
mode_stereo = 0x04         # 3840x1080 @72  <- preferred, verified working on Steam Deck
mode_stereo_fallback = 0x03 # 3840x1080 @60
# IMU mounting: sensor +X points out of the left temple, +Y out of the back of the head, +Z
# out of the top. Measured against gravity, not guessed: held level, the accelerometer reads
# +1 g on Z, which names the up axis; tipping the nose down leaves X unchanged, which names
# the left axis; forward is then whatever is left over, and it is -Y.
#
# This is the fact the wearer kept having to rediscover by hand. It is a property of where
# the chip is soldered, so it is the same on every Air gen 1 and there is nothing here for a
# per-user calibration to find.
sensor_axes = ["left", "back", "up"]

# The rows below deliberately omit `sensor_axes`. The Air family very probably shares the Air
# gen 1's mounting, but "very probably" is exactly the reasoning that produced a world where
# nodding rolled the horizon. An absent mounting sends the wearer through calibration, which
# is the honest outcome for hardware nobody here has held. Fill a row in when one has been
# measured, not when it seems likely.

[[device]]
name = "XREAL Air 2"
driver = "xreal"
vid = 0x3318
pid = 0x0428
verified = false
imu_interface = 3
mcu_interface = 4
imu_report_len = 64
per_eye = [1920, 1080]
h_fov_deg = 42.0
default_ipd_mm = 63.0
mode_mono = 0x05
mode_stereo = 0x04
mode_stereo_fallback = 0x03

[[device]]
name = "XREAL Air 2 Pro"
driver = "xreal"
vid = 0x3318
pid = 0x0432
verified = false
imu_interface = 3
mcu_interface = 4
imu_report_len = 64
per_eye = [1920, 1080]
h_fov_deg = 42.0
default_ipd_mm = 63.0
mode_mono = 0x05
mode_stereo = 0x04
mode_stereo_fallback = 0x03

# The Ultra is deliberately listed with its real interface numbers even though it is not
# expected to work yet: its 512-byte IMU reports mean the packet parser needs a second
# layout, not just a table row. Better to fail with "unverified layout" than to silently
# mis-parse.
[[device]]
name = "XREAL Air 2 Ultra"
driver = "xreal"
vid = 0x3318
pid = 0x0426
verified = false
imu_interface = 2
mcu_interface = 0
imu_report_len = 512
per_eye = [1920, 1080]
h_fov_deg = 46.0
default_ipd_mm = 63.0
mode_mono = 0x05
mode_stereo = 0x04
mode_stereo_fallback = 0x03
