[package]
name = "spatiand-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
glam.workspace = true
log.workspace = true
thiserror.workspace = true
# dlopen for libmysofa, so a machine without it still runs -- see `hrtf`.
libloading = "0.8"

# The audio server, and the only part of this crate that is not portable arithmetic. Optional
# so that the geometry and the rendering can be built and tested on any machine -- including a
# development one with no PipeWire at all -- and so that a platform with a different audio
# server is a new module here rather than a fork of the crate.
[target.'cfg(target_os = "linux")'.dependencies]
# `v0_3_49` is what exposes `Buffer::requested`, which is how many frames the graph is
# asking for this cycle. The bindings gate it because the field arrived in PipeWire
# 0.3.49; SteamOS ships 1.6, and everything this runs on is far past it.
pipewire = { version = "0.8", optional = true, features = ["v0_3_49"] }

[dev-dependencies]
env_logger.workspace = true

[[example]]
name = "spatial-check"
required-features = ["server"]

[features]
default = []
server = ["dep:pipewire"]
