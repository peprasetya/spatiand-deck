[package]
name = "spatiand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
spatiand-hmd = { path = "../spatiand-hmd" }
spatiand-track = { path = "../spatiand-track" }
spatiand-render = { path = "../spatiand-render" }
spatiand-input = { path = "../spatiand-input" }
spatiand-shell = { path = "../spatiand-shell" }
spatiand-platform = { path = "../spatiand-platform" }
# Spatial audio. The `server` feature is what talks to PipeWire; without it the crate is
# arithmetic only, which is how it stays testable on a machine with no audio server.
spatiand-audio = { path = "../spatiand-audio", features = ["server"] }

glam.workspace = true
log.workspace = true
# Preferences on disk. Already built for the tracker's axis map.
serde.workspace = true
toml.workspace = true
env_logger.workspace = true
thiserror.workspace = true
# localtime_r for the status clock, and nothing else.
libc = "0.2"

# Only the two codecs panoramas and app icons actually come in. The default feature set drags
# in a dozen more decoders that would never be reached and are not free to build on the Deck.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Real application icons. KDE ships 19,978 SVGs against 176 PNGs, so without an SVG
# rasteriser the launcher has almost no icons on it. resvg is pure Rust and pulls in usvg and
# tiny-skia; that is the whole cost.
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_winit",   # nested development backend: runs as a window under KDE
    "backend_drm",     # the real thing: owns the glasses and the Deck panel
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "renderer_gl",     # GLES 3.2 — see the plan for why not Vulkan
    "wayland_frontend",
    "desktop",
    "use_system_lib",
    # X11 applications. Many programs have no Wayland support and never will; without this
    # they do not start at all. See `crate::xwayland`.
    "xwayland",
]
