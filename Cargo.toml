[workspace]
resolver = "2"
members = [
    "crates/spatiand-hmd",
    "crates/spatiand-track",
    "crates/spatiand-render",
    "crates/spatiand",
]

# Crates scaffolded but not yet implemented are deliberately left out of `members`
# until they compile, so `cargo build` at the root always means something.
#   spatiand-input     spatiand-platform
#   spatiand-shell     spatiand-media     spatiand-proto

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/paulus/spatiand"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The tracker runs a filter at ~1 kHz; unoptimised it is unusable even in debug builds.
[profile.dev.package.spatiand-track]
opt-level = 2
[profile.dev.package.glam]
opt-level = 3
